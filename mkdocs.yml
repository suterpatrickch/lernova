site_name: Lernova
site_description: Kostenlose Lernplattform für Wirtschaft, Recht, Finanzen und Lebenskompetenzen
site_url: https://lernova.pages.dev
repo_url: ""

theme:
  name: material
  language: de
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple

nav:
  - Start: index.md
  - Lernwege: lernwege.md
  - Wirtschaft:
      - Überblick: wirtschaft/index.md
      - Angebot & Nachfrage: wirtschaft/angebot-nachfrage.md
      - Unternehmen verstehen: wirtschaft/unternehmen.md
  - Recht:
      - Überblick: recht/index.md
      - Kaufvertrag: recht/kaufvertrag.md
      - Mietvertrag: recht/mietvertrag.md
  - FRW & Geld:
      - Überblick: frw/index.md
      - Budget: frw/budget.md
      - Lohnabrechnung: frw/lohnabrechnung.md
  - Leben & Zukunft:
      - Überblick: leben/index.md
      - Versicherungen: leben/versicherungen.md
      - Schuldenfallen: leben/schuldenfallen.md
  - Für Autor:innen: autoren.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - assets/styles.css
