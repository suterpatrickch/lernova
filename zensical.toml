[project]
site_name = "Lernova"
site_url = "https://lernova2.pages.dev"
site_description = "Lernwege, Nuggets und Lebenssituationen für Matura, Beruf und Zukunft."
site_author = "Lernova"
docs_dir = "docs"
site_dir = "site"
copyright = "© Lernova – Proof of Concept"
extra_css = ["stylesheets/extra.css"]
nav = [
  {"Start" = "index.md"},
  {"Lernwege" = "lernwege.md"},
  {"Wirtschaft" = [
    "wirtschaft/index.md",
    {"Angebot & Nachfrage" = "wirtschaft/angebot-nachfrage.md"},
    {"Unternehmen verstehen" = "wirtschaft/unternehmen.md"}
  ]},
  {"Recht" = [
    "recht/index.md",
    {"Kaufvertrag" = "recht/kaufvertrag.md"},
    {"Mietvertrag" = "recht/mietvertrag.md"}
  ]},
  {"FRW & Geld" = [
    "frw/index.md",
    {"Budget" = "frw/budget.md"},
    {"Lohnabrechnung" = "frw/lohnabrechnung.md"}
  ]},
  {"Leben" = [
    "leben/index.md",
    {"Versicherungen" = "leben/versicherungen.md"},
    {"Schuldenfallen" = "leben/schuldenfallen.md"}
  ]},
  {"Autor:innen" = "autoren.md"}
]

[project.theme]
variant = "modern"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.expand",
  "navigation.path",
  "navigation.tracking",
  "toc.follow",
  "content.code.copy"
]

[[project.theme.palette]]
scheme = "default"
primary = "black"
accent = "violet"
toggle.icon = "lucide/moon"
toggle.name = "Dunkelmodus aktivieren"

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "violet"
toggle.icon = "lucide/sun"
toggle.name = "Hellmodus aktivieren"
