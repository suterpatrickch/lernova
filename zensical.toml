[project]
site_name = "Lernova"
site_description = "Proof of Concept: modulare Lernplattform für Wirtschaft & Recht"
site_author = "Lernova"
site_url = "https://DEIN-GITHUB-NAME.github.io/DEIN-REPO-NAME/"
docs_dir = "docs"
copyright = "Lernova PoC – Inhalte als Beispielstruktur"

nav = [
  { "Start" = "index.md" },
  { "Wirtschaft" = [
    { "Überblick" = "wirtschaft/index.md" },
    { "Grundfragen des Wirtschaftens" = "wirtschaft/grundfragen.md" },
    { "Wirtschaftskreislauf" = "wirtschaft/wirtschaftskreislauf.md" }
  ]},
  { "Unternehmen" = [
    { "Überblick" = "unternehmen/index.md" },
    { "Unternehmensmodell" = "unternehmen/unternehmensmodell.md" },
    { "Marketing" = "unternehmen/marketing.md" }
  ]},
  { "Recht" = [
    { "Überblick" = "recht/index.md" },
    { "Grundlagen des Rechts" = "recht/grundlagen.md" },
    { "Kaufvertrag" = "recht/kaufvertrag.md" },
    { "Arbeitsvertrag" = "recht/arbeitsvertrag.md" }
  ]},
  { "Volkswirtschaft" = [
    { "Überblick" = "volkswirtschaft/index.md" },
    { "Angebot & Nachfrage" = "volkswirtschaft/angebot-nachfrage.md" },
    { "Inflation & Geldpolitik" = "volkswirtschaft/inflation-geldpolitik.md" }
  ]},
  { "FRW" = [
    { "Überblick" = "frw/index.md" },
    { "Bilanz & Erfolgsrechnung" = "frw/bilanz-erfolgsrechnung.md" },
    { "Konto & Buchungssatz" = "frw/konto-buchungssatz.md" }
  ]}
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]

[project.theme]
language = "de"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/sparkles"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Dunkelmodus"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Hellmodus"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
