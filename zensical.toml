[project]
site_name = "Lernova"
site_description = "Proof of Concept: schlanke, kursartige Lernplattform für Wirtschaft & Recht"
site_author = "Lernova"
site_url = "https://DEIN-GITHUB-NAME.github.io/DEIN-REPO-NAME/"
docs_dir = "docs"
copyright = "Lernova PoC – Beispielstruktur"

nav = [
  { "Start" = "index.md" },
  { "Wirtschaft" = [
    { "Überblick" = "wirtschaft/index.md" },
    { "Grundfragen des Wirtschaftens" = [
      { "Themenübersicht" = "wirtschaft/grundfragen/index.md" },
      { "Bedürfnisse & Güter" = "wirtschaft/grundfragen/beduerfnisse-gueter.md" },
      { "Knappheit & ökonomisches Prinzip" = "wirtschaft/grundfragen/knappheit-oekonomisches-prinzip.md" },
      { "Wohlstand & Wohlfahrt" = "wirtschaft/grundfragen/wohlstand-wohlfahrt.md" }
    ]},
    { "Wirtschaftskreislauf" = "wirtschaft/wirtschaftskreislauf.md" }
  ]},
  { "Unternehmen" = [
    { "Überblick" = "unternehmen/index.md" },
    { "Unternehmensmodell" = [
      { "Themenübersicht" = "unternehmen/unternehmensmodell/index.md" },
      { "Umweltsphären" = "unternehmen/unternehmensmodell/umweltsphaeren.md" },
      { "Anspruchsgruppen" = "unternehmen/unternehmensmodell/anspruchsgruppen.md" },
      { "Zielkonflikte" = "unternehmen/unternehmensmodell/zielkonflikte.md" }
    ]},
    { "Marketing" = "unternehmen/marketing.md" }
  ]},
  { "Recht" = [
    { "Überblick" = "recht/index.md" },
    { "Grundlagen des Rechts" = "recht/grundlagen.md" },
    { "Kaufvertrag" = [
      { "Themenübersicht" = "recht/kaufvertrag/index.md" },
      { "Vertragsabschluss" = "recht/kaufvertrag/vertragsabschluss.md" },
      { "Rechte & Pflichten" = "recht/kaufvertrag/rechte-pflichten.md" },
      { "Mangelhafte Lieferung" = "recht/kaufvertrag/mangelhafte-lieferung.md" },
      { "Verzug" = "recht/kaufvertrag/verzug.md" }
    ]},
    { "Arbeitsvertrag" = "recht/arbeitsvertrag.md" }
  ]},
  { "Volkswirtschaft" = [
    { "Überblick" = "volkswirtschaft/index.md" },
    { "Märkte & Preisbildung" = [
      { "Themenübersicht" = "volkswirtschaft/angebot-nachfrage/index.md" },
      { "Nachfrage" = "volkswirtschaft/angebot-nachfrage/nachfrage.md" },
      { "Angebot" = "volkswirtschaft/angebot-nachfrage/angebot.md" },
      { "Marktgleichgewicht" = "volkswirtschaft/angebot-nachfrage/marktgleichgewicht.md" }
    ]},
    { "Inflation & Geldpolitik" = "volkswirtschaft/inflation-geldpolitik.md" }
  ]},
  { "FRW" = [
    { "Überblick" = "frw/index.md" },
    { "Bilanz & Erfolgsrechnung" = [
      { "Themenübersicht" = "frw/bilanz-erfolgsrechnung/index.md" },
      { "Bilanz" = "frw/bilanz-erfolgsrechnung/bilanz.md" },
      { "Erfolgsrechnung" = "frw/bilanz-erfolgsrechnung/erfolgsrechnung.md" },
      { "Zusammenhang Bilanz & ER" = "frw/bilanz-erfolgsrechnung/zusammenhang.md" }
    ]},
    { "Konto & Buchungssatz" = "frw/konto-buchungssatz.md" }
  ]}
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]

[project.theme]
language = "de"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/sparkles"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Dunkelmodus"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Hellmodus"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
